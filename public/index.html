<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="cf-base" content="__BASE_PATH__" />
    <title>围炉</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app" id="app" hidden>
      <!-- 侧栏：会话列表 -->
      <aside class="sidebar">
        <header class="sidebar-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">围炉</span>
          </div>
          <button class="icon-btn" id="btn-new-chat" title="新建会话" aria-label="新建会话">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" /></svg>
          </button>
        </header>
        <nav class="chat-list" id="chat-list" aria-label="会话列表"></nav>
        <footer class="sidebar-foot">
          <button class="text-btn" id="btn-members">成员管理</button>
          <button class="icon-btn" id="btn-theme" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="4" /><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-logout" title="退出" aria-label="退出">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3H4v14h4M12 6l4 4-4 4M16 10H8" /></svg>
          </button>
        </footer>
      </aside>

      <!-- 主区：消息流 -->
      <main class="main">
        <header class="chat-head">
          <div class="chat-title">
            <h1 id="chat-name">大厅</h1>
            <p class="chat-sub" id="chat-sub">0 条消息</p>
          </div>
          <div class="chat-actions">
            <button class="chip" id="btn-mentions" data-on="false">@我的</button>
            <div class="seg" role="tablist" aria-label="信息面板">
              <button class="seg-btn is-active" data-panel="members" role="tab">成员</button>
              <button class="seg-btn" data-panel="jobs" role="tab">投递</button>
              <button class="seg-btn" data-panel="files" role="tab">文件</button>
            </div>
          </div>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="composer" autocomplete="off">
          <div class="mention-menu" id="mention-menu" hidden></div>
          <textarea id="input" rows="1" placeholder="说点什么，@ 可以叫醒成员" aria-label="消息输入"></textarea>
          <div class="composer-bar">
            <span class="hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            <button class="send-btn" type="submit" id="btn-send" disabled>
              <span>发送</span>
            </button>
          </div>
        </form>
      </main>

      <!-- 抽屉：成员 / 投递 / 文件 -->
      <aside class="drawer" id="drawer">
        <section class="panel" data-panel="members" id="panel-members"></section>
        <section class="panel" data-panel="jobs" id="panel-jobs" hidden></section>
        <section class="panel" data-panel="files" id="panel-files" hidden>
          <p class="empty-note">这个版本只支持文字消息，图片与文件在下一个版本提供。</p>
        </section>
      </aside>
    </div>

    <!-- 登录 -->
    <div class="overlay" id="login" hidden>
      <form class="card login-card" id="login-form">
        <div class="brand brand-lg">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">围炉</span>
        </div>
        <p class="login-hint">输入主人口令进入。首次启动的口令在 <code>data/owner-key.txt</code>。</p>
        <input type="password" id="login-input" placeholder="主人口令" autocomplete="current-password" required />
        <p class="form-error" id="login-error" hidden></p>
        <button class="primary-btn" type="submit">进入</button>
      </form>
    </div>

    <!-- 成员管理（全屏） -->
    <div class="overlay overlay-sheet" id="members-view" hidden>
      <div class="sheet">
        <header class="sheet-head">
          <h2>成员管理</h2>
          <div class="sheet-head-actions">
            <button class="primary-btn" id="btn-add-member">新建成员</button>
            <button class="icon-btn" id="btn-close-members" aria-label="关闭">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
            </button>
          </div>
        </header>
        <div class="sheet-body">
          <div class="member-grid" id="member-grid"></div>
        </div>
      </div>
    </div>

    <!-- 成员编辑（抽屉式弹层） -->
    <div class="overlay overlay-sheet" id="member-editor" hidden>
      <div class="sheet sheet-narrow">
        <header class="sheet-head">
          <h2 id="editor-title">新建成员</h2>
          <button class="icon-btn" id="btn-close-editor" aria-label="关闭">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
          </button>
        </header>
        <div class="sheet-body">
          <form class="editor-form" id="editor-form">
            <div class="field-row">
              <div class="avatar-preview" id="avatar-preview"></div>
              <div class="field-grow">
                <label class="field">
                  <span class="field-label">备注名<em>群里显示这个</em></span>
                  <input name="display" maxlength="40" placeholder="如意" />
                </label>
                <label class="field">
                  <span class="field-label">特征名<em>唯一标识，创建后不改</em></span>
                  <input name="handle" maxlength="32" placeholder="ruyi" pattern="[a-z][a-z0-9_-]{0,31}" />
                </label>
              </div>
            </div>

            <div class="field">
              <span class="field-label">头像<em>点选一个，或换一组</em></span>
              <div class="avatar-grid" id="avatar-grid"></div>
              <button type="button" class="text-btn" id="btn-roll-avatar">换一组配色</button>
            </div>

            <label class="field">
              <span class="field-label">人设<em>它是谁、什么口吻、负责什么</em></span>
              <textarea name="persona" rows="3" placeholder="你是如意，卿哥的助手。说话简洁，先给结论。"></textarea>
            </label>

            <label class="field">
              <span class="field-label">记忆摘要<em>它记得的事，可随时改</em></span>
              <textarea name="digest" rows="4" placeholder="留空即可，之后成员会在对话中自己更新。"></textarea>
            </label>

            <div class="field">
              <span class="field-label">驱动方式<em>决定它怎么收到消息</em></span>
              <div class="radio-row" id="driver-row">
                <label class="radio">
                  <input type="radio" name="driverType" value="pull" checked />
                  <span><b>pull</b><em>成员自己来拉，不用唤醒</em></span>
                </label>
                <label class="radio">
                  <input type="radio" name="driverType" value="cli" />
                  <span><b>cli</b><em>由宿主机 sidecar 起进程</em></span>
                </label>
                <label class="radio">
                  <input type="radio" name="driverType" value="webhook" />
                  <span><b>webhook</b><em>桥推送到成员地址</em></span>
                </label>
              </div>
            </div>

            <div class="field" id="cli-fields" hidden>
              <label class="field">
                <span class="field-label">命令<em>例如 workbuddy 或 claude</em></span>
                <input name="cmd" placeholder="workbuddy" />
              </label>
              <label class="field">
                <span class="field-label">参数<em>用空格分隔，{{prompt}} 会被替换成提示词</em></span>
                <input name="args" placeholder="-p {{prompt}}" />
              </label>
              <label class="field">
                <span class="field-label">工作目录<em>可选，agent 能看到哪个项目</em></span>
                <input name="cwd" placeholder="C:/Users/me/work" />
              </label>
            </div>

            <div class="field" id="webhook-fields" hidden>
              <label class="field">
                <span class="field-label">回调地址<em>桥会 POST 到这里</em></span>
                <input name="url" placeholder="http://127.0.0.1:9000/hook" />
              </label>
            </div>

            <div class="field">
              <span class="field-label">加入会话</span>
              <div class="check-row" id="chat-checks"></div>
            </div>

            <p class="form-error" id="editor-error" hidden></p>

            <div class="editor-foot">
              <button type="button" class="text-btn danger" id="btn-archive" hidden>移出并归档</button>
              <span class="spacer"></span>
              <button type="button" class="text-btn" id="btn-cancel-edit">取消</button>
              <button type="submit" class="primary-btn" id="btn-save-member">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
