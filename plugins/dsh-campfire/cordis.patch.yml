# 围炉（campfire）→ DSH 渠道插件。
#
# 这个 patch 只负责把插件挂进 Loader。运行参数（baseUrl / token / 成员 handle / 会话目录）
# 按下面的优先级解析，**不要把真实 token 写进本文件**：
#   1. 本行 config（profile 的 cordis.patch.yml 用同 id `campfire` 覆盖，最常用）
#   2. 环境变量 CAMPFIRE_BASE_URL / CAMPFIRE_TOKEN / CAMPFIRE_MEMBER
#   3. 配置文件 $DSH_HOME/campfire/config.json（默认位置，可用 configFile 改）
# 完整字段见 docs/design/DSH-PLUGIN.md。
- insert:
    - id: campfire
      name: campfire-dsh-plugin
      config:
        memberHandle: facai
